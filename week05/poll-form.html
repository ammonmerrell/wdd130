<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="stylesheet" href="styles/poll-form.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300&family=Tinos&display=swap" rel="stylesheet">


    <title>Poll Form | WDD130</title>
</head>

<body>
    <header>
        <h1>Poll Form | WDD130</h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>Contact Information</legend>
                <div class="form-item column2">
                    <label>Full Name<input type="text" name="fullname"></label>
                </div>
                <div class="form-item column2">
                    <label>Email<input type="email" name="useremail"></label>
                </div>
            </fieldset>
            <fieldset>
                <legend>Questions</legend>
                <label for="browser">What is you favorite Browser?</label>
                <div class="form-item">
                    <select id="browser" name="browser"></select>
                </div>
                    <option value="Chrome">Google Chrome</option>
                    <option value="edge">Microsoft Edge</option>
                    <option value="firefox">Mozilla Firefox</option>
                </select>
                <label for="pet">Do you have a household pet?</label>
                <div class="form-item">
                    <input type="checkbox" id="pet" name="pet" value="pet">
                </div>
                <label for="pet">Yes</label>
                <label for="feedback">List the places you have lived.</label>
                <textarea id="feedback" name="feedback" rows="4" placeholder="London England, Tibuktu Mali, Stillwater Flordia, Venice Italy"></textarea>
            </fieldset>
            <button type="submit">Submit Poll</button>
        </form>
    </main>
    <footer>
        <p>&copy;2025 | Poll | Ammon Merrell</p>
    </footer>
</body>

</html>
