    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Winky+Sans:wght@300;800&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <img src="../wwr/images/z-wwr-blue.jpg" alt="wwr logo">
        <nav>
            <a href="index.html">Index</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <main>
        <section>
            <h1>Contact Information</h1>
            <p class="address">Address: 1251 S 2736 W Landing Loop Rd.</p>
            <p class="phone">Main Office: 183-521-3650</p>
            <p class="email">Email: whitewaterrafting@gmail.com</p>
            <div>
                <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d7000.166329929716!2d-121.98485732208385!3d41.23430318917404!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1743771342852!5m2!1sen!2sus" width="600" height="450"  allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            <figure class ="one">
            <img src="images/linkedin-sales-solutions-Kfzfd8ksE10-unsplash.jpg" alt="">
            <figcaption>Seinor Executive Rafting Planner</figcaption>
            </figure>
            <figure class="two">
            <img src="images/outward-bound-costa-rica-h4x1RVIo10E-unsplash.jpg" alt="">
            <figcaption>Seinor Executive Rafting Guide</figcaption>
            </figure>
            <figure class="three">
                <img src="images/avtar-singh-sandhu-hDkKVIa1F7Y-unsplash.jpg" alt="">
                <figcaption>Junior Executive Rafting Guide</figcaption>
            </figure>
        </section>
        <form>
            <fieldset>
                <legend>Contact Information</legend>
                <div class="name">
                    <label>Fullname: <input type="text" name="fullname"></label>
                </div>
                <div class="email">
                    <label>Email: <input type="text" name="email"></label> 
                </div>
            </fieldset>
            <fieldset>
                <legend>Email</legend>
                <div class="Purpose">
                    <p>purpose: </p>
                    <label>General Inquiry<input type="radio" name="inquiry"></label>
                    <label>Reservation Question<input type="radio" name="reservation"></label>
                    <label>Website Suggestion<input type="radio" name="suggestion"></label>
                </div>
                <div class="message">
                    <label for="message">message: </label>
                    <textarea id="message" name="message" rows="4" placeholder="Enter text here."></textarea>
                </div>
                <div class="newsletter">
                    <!-- <label for="newsletter">newsletter subscription</label> -->
                    <input type="checkbox" id="news" name="news" value="news">
                    <label for="pet">Please subscribe me to the monthly newsletter</label>
                </div>
            </fieldset>
            <button type="submit">Submit Email</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2025 | White Water Rafting | Ammon Merrell</p>
